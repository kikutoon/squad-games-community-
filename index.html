<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SQAD Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #161920;
      --accent: #ff0055;
      --accent-glow: rgba(255, 0, 85, 0.4);
      --text: #ffffff;
      --muted: #8a8f9d;
      --border: #262b36;
      --gold: #ffd700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .balance-box {
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      font-weight: bold;
      color: var(--gold);
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .screen {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .screen.active {
      display: flex;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid var(--border);
    }

    .reels {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .reel {
      width: 80px;
      height: 80px;
      background: #000;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      border: 2px solid var(--border);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    button.primary {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #ff0055, #ff5500);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: transform 0.1s, opacity 0.2s;
    }

    button.primary:active {
      transform: scale(0.98);
    }

    button.primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    nav {
      display: flex;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 8px 0;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--accent);
    }

    .bets-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .royaleBet {
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: white;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
    }

    .royaleBet.active {
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #000;
      color: white;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
    }

    .players-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      font-size: 14px;
    }

    .royaleHidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="user-info">
      <div class="avatar" id="uAvatar">S</div>
      <div>
        <div id="uName" style="font-weight: bold; font-size: 14px;">SQAD Player</div>
        <div id="uLevel" style="font-size: 11px; color: var(--muted);">Lvl 1</div>
      </div>
    </div>
    <div class="balance-box">
      ⚡ <span id="uBalance">0</span>
    </div>
  </header>

  <main>
    <!-- Screen: Classic Slots -->
    <div id="screen-slots" class="screen active">
      <div class="card" style="text-align: center;">
        <h2 style="font-size: 18px; margin-bottom: 8px;">SQAD Slots</h2>
        <p style="font-size: 12px; color: var(--muted);">Испытай удачу и заработай баллы</p>
        <div class="reels">
          <div class="reel" id="s1">🎰</div>
          <div class="reel" id="s2">🎰</div>
          <div class="reel" id="s3">🎰</div>
        </div>
        <button class="primary" id="spinBtn" onclick="classicSpin()">КРУТИТЬ (10 ⚡)</button>
      </div>
    </div>

    <!-- Screen: SQAD Royale (Multiplayer) -->
    <div id="screen-royale" class="screen">
      <!-- Lobby Mode -->
      <div id="royaleLobby" class="card">
        <h3 style="margin-bottom: 12px;">SQAD Royale</h3>
        
        <label style="font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px;">Выбери ставку:</label>
        <div class="bets-grid">
          <button class="royaleBet active" data-royale-bet="10" onclick="selectRoyaleBet(10, this)">10</button>
          <button class="royaleBet" data-royale-bet="25" onclick="selectRoyaleBet(25, this)">25</button>
          <button class="royaleBet" data-royale-bet="50" onclick="selectRoyaleBet(50, this)">50</button>
          <button class="royaleBet" data-royale-bet="100" onclick="selectRoyaleBet(100, this)">100</button>
          <button class="royaleBet" data-royale-bet="250" onclick="selectRoyaleBet(250, this)">250</button>
        </div>

        <button class="primary" style="margin-bottom: 16px;" onclick="royaleCreate()">СОЗДАТЬ КОМНАТУ</button>

        <hr style="border-color: var(--border); margin: 16px 0;" />

        <input type="text" id="royaleJoinCode" placeholder="Код комнаты (6 символов)" maxlength="6" style="text-transform: uppercase;" />
        <button class="primary" style="background: linear-gradient(135deg, #333, #555);" onclick="royaleJoin()">ВОЙТИ В КОМНАТУ</button>
      </div>

      <!-- Room Mode -->
      <div id="royaleRoom" class="card royaleHidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <div>
            <span style="font-size: 12px; color: var(--muted);">Код:</span>
            <strong id="royaleRoomCode" style="font-size: 18px; color: var(--accent); cursor: pointer;" onclick="copyRoyaleCode()">------</strong>
          </div>
          <div>
            <span style="font-size: 12px; color: var(--muted);">Банк:</span>
            <strong id="royalePot" style="color: var(--gold);">0</strong> ⚡
          </div>
        </div>

        <div style="font-size: 12px; margin-bottom: 12px; color: var(--muted);">
          Статус: <span id="royaleRoomStatus" style="color: #fff;">Ожидание</span> | Раунд: <span id="royaleRoundNow">0</span>/5
        </div>

        <div id="royalePlayArea" class="royaleHidden" style="text-align: center; margin: 16px 0;">
          <div style="font-weight: bold; margin-bottom: 8px;">Твой ход</div>
          <div class="reels">
            <div class="reel" id="rr1">🔥</div>
            <div class="reel" id="rr2">🎟️</div>
            <div class="reel" id="rr3">🎧</div>
          </div>
          <div style="font-size: 11px; color: var(--muted); margin-bottom: 12px;" id="royaleSpinWait">Ждем участников...</div>
          <button class="primary" id="royaleSpinBtn" onclick="royaleSpin()">СДЕЛАТЬ ХОД</button>
        </div>

        <div id="royaleLobbyActions" style="display: flex; gap: 8px; margin-bottom: 12px;">
          <button class="primary" id="royaleReadyBtn" style="flex: 1;" onclick="royaleToggleReady()">ГОТОВ</button>
          <button class="primary" id="royaleStartBtn" style="flex: 1; background: #00e676;" onclick="royaleStart()">СТАРТ</button>
        </div>

        <div style="font-weight: bold; font-size: 14px; margin-top: 12px;">Участники:</div>
        <div class="players-list" id="royalePlayers"></div>

        <div id="royaleFinal" class="royaleHidden" style="margin-top: 16px; padding: 12px; background: rgba(255,215,0,0.1); border: 1px solid var(--gold); border-radius: 8px; text-align: center;"></div>

        <button class="primary" id="royaleLeaveBtn" style="margin-top: 16px; background: transparent; border: 1px solid var(--border);" onclick="royaleLeave()">← Выйти</button>
      </div>

      <div class="card">
        <div style="font-weight: bold; margin-bottom: 8px;">Таблица баттла</div>
        <div id="royaleScoreTable" style="font-size: 12px;"></div>
      </div>
    </div>

    <!-- Screen: Leaderboard -->
    <div id="screen-top" class="screen">
      <div class="card">
        <h3 style="margin-bottom: 12px;">Топ Игроков</h3>
        <div class="players-list" id="leaderboardList"></div>
      </div>
    </div>
  </main>

  <nav>
    <button class="nav-btn active" onclick="openScreen('slots', this)">
      <span>🎰</span>
      <span>Слоты</span>
    </button>
    <button class="nav-btn" onclick="openScreen('royale', this)">
      <span>👑</span>
      <span>Royale</span>
    </button>
    <button class="nav-btn" onclick="openScreen('top', this)">
      <span>🏆</span>
      <span>Топ</span>
    </button>
  </nav>

  <script>
    const SQAD_BUILD = {
      gameUrl: 'https://kkmanstpvlluaykwlmml.supabase.co/functions/v1/game',
      royaleUrl: 'https://kkmanstpvlluaykwlmml.supabase.co/functions/v1/royale'
    };

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let currentScreen = 'slots';
    window.sqadScore = 0;

    function haptic(type = 'light') {
      try { tg?.HapticFeedback?.impactOccurred(type); } catch(e) {}
    }

    function openScreen(id, btn) {
      currentScreen = id;
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(`screen-${id}`)?.classList.add('active');
      if (btn) btn.classList.add('active');

      if (id === 'top') loadLeaderboard();
      if (id === 'royale') {
        if (royaleRoomCode) {
          royaleUiMode(true);
          royaleRefresh();
          royaleStartPolling();
        } else {
          royaleUiMode(false);
        }
      } else {
        royaleStopPolling();
      }
    }

    function updateUI() {
      document.getElementById('uBalance').textContent = window.sqadScore || 0;
    }

    async function apiRequest(url, action, data = {}) {
      const initData = tg?.initData || '';
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, initData, ...data })
      });
      const result = await response.json();
      if (!response.ok || !result.ok) {
        throw new Error(result.error || 'Ошибка сервера');
      }
      return result;
    }

    // --- CLASSIC SLOTS ---
    async function loadUserData() {
      try {
        const res = await apiRequest(SQAD_BUILD.gameUrl, 'get_balance');
        window.sqadScore = res.balance?.points || 0;
        document.getElementById('uLevel').textContent = `Lvl ${res.balance?.level || 1}`;
        if (tg?.initDataUnsafe?.user) {
          const u = tg.initDataUnsafe.user;
          document.getElementById('uName').textContent = u.first_name || 'SQAD Player';
          document.getElementById('uAvatar').textContent = (u.first_name || 'S').charAt(0).toUpperCase();
        }
        updateUI();
      } catch (e) {
        console.error(e);
      }
    }

    async function classicSpin() {
      const btn = document.getElementById('spinBtn');
      btn.disabled = true;
      haptic('medium');

      try {
        const res = await apiRequest(SQAD_BUILD.gameUrl, 'classic_spin');
        const [s1, s2, s3] = res.game.symbols;
        
        document.getElementById('s1').textContent = s1;
        document.getElementById('s2').textContent = s2;
        document.getElementById('s3').textContent = s3;

        window.sqadScore = res.game.balance;
        updateUI();

        if (res.game.points > 0) {
          haptic('success');
          alert(`Выиграно +${res.game.points} баллов!`);
        }
      } catch (e) {
        alert(e.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function loadLeaderboard() {
      const listEl = document.getElementById('leaderboardList');
      listEl.innerHTML = 'Загрузка...';
      try {
        const res = await apiRequest(SQAD_BUILD.gameUrl, 'get_leaderboard');
        listEl.innerHTML = res.players.map((p, i) => `
          <div class="player-row">
            <span>#${i + 1} ${p.display_name}</span>
            <strong style="color: var(--gold);">${p.points} ⚡</strong>
          </div>
        `).join('');
      } catch (e) {
        listEl.innerHTML = 'Ошибка загрузки';
      }
    }

    // --- SQAD ROYALE MULTIPLAYER ---
    let royaleBet = 10, royaleRoomCode = '', royaleState = null, royalePoll = null, royaleBusy = false;

    function selectRoyaleBet(amount, el) {
      if (royaleBusy) return;
      royaleBet = Number(amount);
      document.querySelectorAll('.royaleBet').forEach(x => x.classList.toggle('active', Number(x.dataset.royaleBet) === royaleBet));
      haptic('light');
    }

    function royaleUiMode(inRoom) {
      document.getElementById('royaleLobby')?.classList.toggle('royaleHidden', inRoom);
      document.getElementById('royaleRoom')?.classList.toggle('royaleHidden', !inRoom);
    }

    async function royaleCreate() {
      if (royaleBusy) return;
      royaleBusy = true;
      try {
        const res = await apiRequest(SQAD_BUILD.royaleUrl, 'royale_create', { bet: royaleBet });
        royaleState = res;
        royaleRoomCode = res.room?.code || '';
        window.sqadScore = Math.max(0, (window.sqadScore || 0) - royaleBet);
        updateUI();
        royaleRender();
        royaleStartPolling();
      } catch (e) {
        alert(e.message);
      } finally {
        royaleBusy = false;
      }
    }

    async function royaleJoin() {
      if (royaleBusy) return;
      const code = (document.getElementById('royaleJoinCode')?.value || '').trim().toUpperCase();
      if (code.length !== 6) return alert('Введи 6-значный код');
      royaleBusy = true;
      try {
        const res = await apiRequest(SQAD_BUILD.royaleUrl, 'royale_join', { room_code: code });
        royaleState = res;
        royaleRoomCode = code;
        royaleRender();
        royaleStartPolling();
      } catch (e) {
        alert(e.message);
      } finally {
        royaleBusy = false;
      }
    }

    async function royaleToggleReady() {
      if (royaleBusy || !royaleRoomCode) return;
      royaleBusy = true;
      try {
        const me = (royaleState?.players || []).find(p => p.is_me);
        const res = await apiRequest(SQAD_BUILD.royaleUrl, 'royale_ready', { room_code: royaleRoomCode, ready: !me?.ready });
        royaleState = res;
        royaleRender();
      } catch (e) {
        alert(e.message);
      } finally {
        royaleBusy = false;
      }
    }

    async function royaleStart() {
      if (royaleBusy || !royaleRoomCode) return;
      royaleBusy = true;
      try {
        const res = await apiRequest(SQAD_BUILD.royaleUrl, 'royale_start', { room_code: royaleRoomCode });
        royaleState = res;
        royaleRender();
      } catch (e) {
        alert(e.message);
      } finally {
        royaleBusy = false;
      }
    }

    async function royaleSpin() {
      if (royaleBusy || !royaleRoomCode) return;
      royaleBusy = true;
      try {
        const res = await apiRequest(SQAD_BUILD.royaleUrl, 'royale_spin', { room_code: royaleRoomCode });
        royaleState = res;
        royaleRender();
      } catch (e) {
        alert(e.message);
      } finally {
        royaleBusy = false;
      }
    }

    async function royaleRefresh() {
      if (!royaleRoomCode || royaleBusy) return;
      try {
        const res = await apiRequest(SQAD_BUILD.royaleUrl, 'royale_state', { room_code: royaleRoomCode });
        royaleState = res;
        royaleRender();
      } catch (e) {
        if (['ROOM_NOT_FOUND', 'NOT_IN_ROOM'].includes(e.message)) {
          royaleStopPolling();
          royaleRoomCode = '';
          royaleUiMode(false);
        }
      }
    }

    function royaleStartPolling() {
      royaleStopPolling();
      royalePoll = setInterval(royaleRefresh, 2000);
    }

    function royaleStopPolling() {
      if (royalePoll) clearInterval(royalePoll);
      royalePoll = null;
    }

    async function royaleLeave() {
      royaleStopPolling();
      royaleRoomCode = '';
      royaleState = null;
      royaleUiMode(false);
    }

    function copyRoyaleCode() {
      if (royaleRoomCode) {
        navigator.clipboard?.writeText(royaleRoomCode);
        alert('Код скопирован!');
      }
    }

    function royaleRender() {
      const r = royaleState?.room;
      if (!r) return royaleUiMode(false);

      royaleUiMode(true);
      document.getElementById('royaleRoomCode').textContent = r.code;
      document.getElementById('royaleRoomStatus').textContent = r.status;
      document.getElementById('royaleRoundNow').textContent = r.current_round || 0;
      document.getElementById('royalePot').textContent = r.pot || 0;

      const ps = royaleState.players || [];
      document.getElementById('royalePlayers').innerHTML = ps.map(p => `
        <div class="player-row">
          <span>${p.is_host ? '👑 ' : ''}${p.display_name} ${p.is_me ? '(Ты)' : ''}</span>
          <span style="color: ${p.ready ? '#00e676' : 'var(--muted)'};">${p.ready ? 'ГОТОВ' : 'В ПОИСКЕ'}</span>
        </div>
      `).join('');

      document.getElementById('royaleScoreTable').innerHTML = ps.map((p, i) => `
        <div class="player-row">
          <span>#${i + 1} ${p.display_name}</span>
          <strong>${p.total_score || 0} б.</strong>
        </div>
      `).join('');
    }

    // Init
    loadUserData();
  </script>
</body>
</html>
