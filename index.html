<style>
:root {
  --bg: #07030d;
  --panel: #11071e;
  --panel-border: rgba(255, 63, 200, 0.25);
  --pink: #ff3fc8;
  --pink-glow: rgba(255, 63, 200, 0.4);
  --violet: #8d5cff;
  --cyan: #48dcff;
  --gold: #ffd45c;
  --green: #2ecc71;
  --red: #e74c3c;
  --text: #ffffff;
  --muted: #a393b8;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }

#app { display: block; min-height: 100vh; padding-bottom: 70px; }

/* SIDEBAR */
.sidebar { width: 62px; background: rgba(13, 5, 25, 0.95); backdrop-filter: blur(15px); border-right: 1px solid var(--panel-border); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 10px; position: fixed; top: 0; bottom: 60px; left: 0; z-index: 100; }
.sidebar-item { width: 44px; height: 44px; border-radius: 12px; background: var(--panel); border: 1px solid var(--panel-border); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
.sidebar-item.active { background: linear-gradient(135deg, var(--pink), var(--violet)); border-color: #fff; box-shadow: 0 0 10px var(--pink-glow); }
.sidebar-label { font-size: 8px; font-weight: 800; color: var(--muted); margin-top: 2px; }

.main-content { margin-left: 62px; padding: 12px; }

/* HEADER */
.header { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 12px; margin-bottom: 10px; border-bottom: 1px solid var(--panel-border); }
.brand { font-weight: 900; font-size: 16px; cursor: pointer; }
.brand span { color: var(--pink); text-shadow: 0 0 10px var(--pink-glow); }
.brand small { display: block; font-size: 8px; color: var(--muted); letter-spacing: 2px; }

.balance-chip { display: flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #1d0933, #0c0417); border: 1px solid var(--pink); border-radius: 18px; padding: 4px 10px; cursor: pointer; }
.balance-num { font-weight: 900; font-size: 13px; color: var(--gold); }

.screen { display: none; }
.screen.active { display: block; }

.hero-card { background: linear-gradient(160deg, #1f0a33, #0d0417); border: 1px solid var(--panel-border); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
.section-title { font-size: 12px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 12px 0 8px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px; padding: 12px; cursor: pointer; }
.card-icon { font-size: 24px; margin-bottom: 4px; }
.card-title { font-weight: 900; font-size: 12px; }
.card-sub { font-size: 9px; color: var(--muted); margin-top: 2px; }

.game-box { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 18px; padding: 14px; text-align: center; }
.btn-primary { width: 100%; padding: 12px; border: 0; border-radius: 12px; background: linear-gradient(90deg, var(--pink), var(--violet)); color: #fff; font-weight: 900; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px var(--pink-glow); margin-top: 10px; }

.input-field { width: 100%; background: #07030d; border: 1px solid var(--panel-border); border-radius: 10px; padding: 10px; color: #fff; font-weight: 700; outline: none; margin-bottom: 8px; }
